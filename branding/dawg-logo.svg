<svg xmlns="http://www.w3.org/2000/svg" width="249" height="84" viewBox="-2 0 83 28" fill="none" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round">
  <title>DAWg</title>
  <!-- Follows the viewer's light or dark preference -->
  <style>
    .ink { stroke: #0d1218; }
    .accent { stroke: #3f82c4; }
    .accent-fill { fill: #3f82c4; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #e5ebf2; }
      .accent { stroke: #74aee2; }
      .accent-fill { fill: #74aee2; }
    }
  </style>
  <!-- The mark: ink with accent reels -->
  <g class="ink">
    <path d="M3 6.5V2.5a5 5 0 0 1 6 4.4" />
    <path d="M15 6.5V2.5a5 5 0 0 1 6 4.4" />
    <path d="M15 22.5a3 3 0 0 1-6 0" />
  </g>
  <g class="accent">
    <circle cx="6" cy="14" r="4" />
    <circle cx="18" cy="14" r="4" />
    <path d="M6 18H18" />
  </g>
  <circle cx="6" cy="14" r="1" class="accent-fill" />
  <circle cx="18" cy="14" r="1" class="accent-fill" />
  <!-- Wordmark, drawn in the same line: DAW in ink, g in the accent (as in the app's top bar) -->
  <g class="ink">
    <path d="M32 8V20H35A6 6 0 0 0 35 8Z" />
    <path d="M44 20L48.5 8L53 20M45.7 15.5H51.3" />
    <path d="M56 8L58.75 20L61.5 11L64.25 20L67 8" />
  </g>
  <g class="accent">
    <circle cx="74" cy="16" r="4" />
    <path d="M78 12V22A4 4 0 0 1 70 22" />
  </g>
</svg>

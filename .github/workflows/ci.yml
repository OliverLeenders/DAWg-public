name: CI

on:
  push:
  pull_request:

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  LINUX_DEPS: >-
    ninja-build libasound2-dev libjack-jackd2-dev ladspa-sdk
    libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev
    libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev
    libxrandr-dev libxrender-dev libxi-dev libwebkit2gtk-4.1-dev
    libegl-dev libglu1-mesa-dev mesa-common-dev llvm-18-dev
  # Faust's LLVM backend (cmake/Faust.cmake) finds the system's LLVM through LLVM_DIR; Windows downloads LLVM's release.
  LLVM_DIR: /usr/lib/llvm-18/lib/cmake/llvm

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Faust.cmake') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: UI tests
        run: npm --prefix ui test

  lint:
    name: Format and clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
          python -m pip install -r tools/requirements.txt

      - name: Check formatting
        run: python tools/lint.py format

      - uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Faust.cmake') }}

      - name: Configure (compile database)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DDAWG_BUILD_UI=OFF

      - name: clang-tidy
        run: python tools/lint.py tidy build

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Check doc comments
        run: |
          mkdir -p build/docs
          doxygen Doxyfile

  sanitizers:
    name: Tests with ${{ matrix.sanitize }} sanitizer
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitize: ['address,undefined', 'thread']
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS clang

      - uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Faust.cmake') }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DDAWG_BUILD_UI=OFF "-DDAWG_SANITIZE=${{ matrix.sanitize }}"
          -DDAWG_FAUST_LLVM=OFF

      - name: Build tests
        run: cmake --build build --target dawg_tests

      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:suppressions=${{ github.workspace }}/tools/ubsan.supp
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure
